{% load custom_tags_and_filters %}
<div class="panel-body">
    <h3 class="customization-section-title">Monitor data settings</h3>
    <form method="POST" action="{% url 'customize' 'monitors' %}" class="form-horizontal">
        {% csrf_token %}
        <div class="form-group">
            <label class="control-label col-md-3" for="monitor_default_daterange">Default daterange</label>
            <div class="col-md-9">
                <div class="radio">
                    <label>
                        <input type="radio"
                               id="monitor_default_daterange"
                               name="monitor_default_daterange"
                               {% if not monitor_default_daterange %}checked{% endif %}
                               value="">
                        Last 24 hrs
                    </label>
                    <label>
                        <input type="radio"
                               name="monitor_default_daterange"
                               {% if monitor_default_daterange == 'last_72hrs' %}checked{% endif %}
                               value="last_72hrs">
                        Last 72 hrs
                    </label>
                    <label>
                        <input type="radio"
                               name="monitor_default_daterange"
                               {% if monitor_default_daterange == 'last_week' %}checked{% endif %}
                               value="last_week">
                        Last week
                    </label>
                    <label>
                        <input type="radio"
                               name="monitor_default_daterange"
                               {% if monitor_default_daterange == 'last_month' %}checked{% endif %}
                               value="last_month">
                        Last month
                    </label>
                    <label>
                        <input type="radio"
                               name="monitor_default_daterange"
                               {% if monitor_default_daterange == 'last_year' %}checked{% endif %}
                               value="last_year">
                        Last year
                    </label>
                </div>
            </div>
        </div>
        <div class="text-center">{% button type="save" value="Save settings" %}</div>
    </form>
</div>
